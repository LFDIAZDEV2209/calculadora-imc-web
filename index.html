<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles.css">
    <script type="module" src="/src/main.js" defer></script>
    <title>Calculadora de IMC</title>
  </head>
  <body>
    <div class="container">
      <h1 class="title">Calculadora de IMC</h1>
      <form>
        <!-- Primer bloque: nombre + edad -->
        <fieldset class="fila-datos">
          <legend>Datos personales</legend>

          <label for="nombre">
            Nombre
            <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
          </label>

          <label for="edad">
            Edad
            <input type="number" id="edad" name="edad" placeholder="Edad" required>
          </label>
        </fieldset>

        <!-- Segundo bloque: peso + altura -->
        <fieldset class="fila-datos">
          <legend>Medidas corporales</legend>

          <label for="peso">
            Peso (kg)
            <input type="number" id="peso" name="peso" placeholder="Peso" required>
          </label>

          <label for="altura">
            Altura (cm)
            <input type="number" id="altura" name="altura" placeholder="Altura" required>
          </label>
        </fieldset>

        <button type="submit" id="btn-calcular">Calcular IMC</button>
      </form>

      <div class="resultado"></div>

      <div class="imagen"></div>

      <button id="btn-reiniciar">Calcular de nuevo</button>
    </div>
    
  </body>
</html>
